name: Workbench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: PYTHONPATH=backend/src python -m unittest discover -s tests -q
      - run: node --check studio-shell.mjs && node --check studio-overview.mjs && node --test tests/studio-overview.test.mjs && node --check workbench.mjs && node --check index.mjs && node --check client.js && node --check runtime.mjs && node --check goal.mjs && node --check preset.mjs
      - run: npm pack --dry-run --ignore-scripts
